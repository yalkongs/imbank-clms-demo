# CI - 배포가 깨질 상태를 push 시점에 잡는다
# =========================================
# smoke:    실제 발생했던 회귀(라우트 가로채기·배포 의존성 누락·전부-0 응답).
#           파라미터 없는 GET 전수 + PDF + 읽기전용 가드.
# frontend: 커밋된 dist 정합성 + 빌드(타입 검사 포함).
#           Render 는 리포의 frontend/dist 를 그대로 서빙하므로, dist 가 누락되거나
#           .gitignore 에 걸리면 배포 화면이 백지가 된다. .githooks/pre-push 가
#           같은 검증을 하지만 --no-verify 나 훅 미설치 환경은 통과해 버린다.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run smoke tests
        run: cd backend && python -m pytest tests -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 빌드보다 먼저 - npm run build 가 dist 를 덮어쓰면 커밋 상태를 볼 수 없다
      - name: 커밋된 dist 정합성 검증
        run: |
          set -e
          fail=0
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::frontend/dist/index.html 이 커밋되지 않았습니다 - 배포 시 백지 화면"
            exit 1
          fi
          for f in $(grep -o '/assets/[^"]*' frontend/dist/index.html); do
            if [ ! -f "frontend/dist$f" ]; then
              echo "::error::번들 누락: frontend/dist$f"
              fail=1
            elif ! git ls-files --error-unmatch "frontend/dist$f" >/dev/null 2>&1; then
              echo "::error::미추적 번들: frontend/dist$f (.gitignore 확인)"
              fail=1
            fi
          done
          if ! git ls-files --error-unmatch database/imbank_demo.db >/dev/null 2>&1; then
            echo "::error::database/imbank_demo.db 가 추적되지 않습니다 - 배포 시 DB 없음"
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "커밋된 dist 정합성 OK"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci

      # tsc && vite build - 타입 오류나 빌드 실패가 배포되는 것을 막는다
      - name: Build
        run: cd frontend && npm run build
