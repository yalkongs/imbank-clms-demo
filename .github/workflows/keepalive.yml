# Render 무료 플랜 콜드스타트 완화
# ==================================
# 무료 인스턴스는 15분 유휴 시 잠들어 첫 접속이 30초 이상 걸린다 — 데모 첫인상을
# 가장 확실하게 망치는 요인이다. 주간 시간대(KST 08~22시)에 /health 를 핑해
# 깨어 있게 한다.
#
# 구조: 자기 연쇄(self-chain). GitHub Actions cron 은 보장이 아니라 최선
# 노력이며, 실측 결과 3시간 연속 스킵도 발생한다 — cron 에 의존하면 활성
# 윈도우 중에도 인스턴스가 잠든다. 그래서 각 실행이 60초 간격으로 20분을
# 핑한 뒤, KST 08~22시 안이면 스스로 다음 실행을 디스패치해 체인을 잇는다
# (workflow_dispatch 는 GITHUB_TOKEN 연쇄 트리거가 허용되는 예외 이벤트).
# cron 은 아침 체인 시동과 체인이 끊겼을 때의 복구용이다. 새 실행이 시작되면
# concurrency 가 이전 실행을 취소하므로 실행 목록의 'cancelled' 는 오류가 아니다.
#
# 무료 플랜 월 750 인스턴스시간 한도 안에서 동작한다 (14시간/일 × 31일 = 434시간).
# 배포 URL 이 바뀌면 아래 RENDER_URL 만 수정.

name: keepalive

on:
  schedule:
    # KST 08:00~22:00 = UTC 23:00~13:00, 10분 간격
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-13 * * *"
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ping /health every 60s for 20 minutes
        run: |
          RENDER_URL="https://imbank-clms-demo.onrender.com"
          END=$(( SECONDS + 1200 ))
          while [ $SECONDS -lt $END ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$RENDER_URL/health" || echo "000")
            echo "$(date -u +%H:%M:%S) health -> $code"
            sleep 60
          done

      - name: Chain next run (KST 08~22)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR_KST=$(TZ=Asia/Seoul date +%H)
          if [ "$HOUR_KST" -ge 8 ] && [ "$HOUR_KST" -lt 22 ]; then
            gh workflow run keepalive.yml -R "${{ github.repository }}"
            echo "chained (KST ${HOUR_KST}h)"
          else
            echo "outside window (KST ${HOUR_KST}h) — chain stops until morning cron"
          fi
