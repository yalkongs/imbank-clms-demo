# Render 무료 플랜 콜드스타트 완화
# ==================================
# 무료 인스턴스는 15분 유휴 시 잠들어 첫 접속이 30초 이상 걸린다 — 데모 첫인상을
# 가장 확실하게 망치는 요인이다. 주간 시간대(KST 08~22시)에 10분 간격으로
# /health 를 핑해 깨어 있게 한다.
#
# 무료 플랜 월 750시간 한도 안에서 동작한다 (14시간/일 × 31일 = 434시간).
# 배포 URL 이 바뀌면 아래 RENDER_URL 만 수정.

name: keepalive

on:
  schedule:
    # KST 08:00~22:00 = UTC 23:00~13:00, 10분 간격
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-13 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        continue-on-error: true
        run: |
          RENDER_URL="https://imbank-clms-demo.onrender.com"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$RENDER_URL/health" || echo "000")
          echo "health -> $code"
